<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>三神明 · 透明立绘</title><style>*{box-sizing:border-box}body{margin:0;padding:24px;background:#20242b;color:#eee;font-family:system-ui}h1{font-size:22px;margin:0 0 6px}p{color:#bbb;font-size:14px;margin:0 0 20px}.controls{display:flex;gap:10px;margin:12px 0 20px}button{border:1px solid #777;background:#303640;color:white;padding:8px 16px;cursor:pointer;border-radius:5px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}.portrait{margin:0;border:1px solid #687078;border-radius:8px;overflow:hidden}.stage{background:repeating-conic-gradient(#bbb 0% 25%,#eee 0% 50%) 0/24px 24px;display:flex;align-items:flex-end;justify-content:center}img{width:100%;height:66vh;object-fit:contain;display:block}figcaption{padding:14px;background:#303640;display:flex;justify-content:space-between}a{color:#e8ca8e}@media(max-width:720px){.grid{grid-template-columns:1fr}img{height:65vh}}</style><h1>三神明 · 透明立绘</h1><p>生命 / 天气 / 死亡 · PNG RGBA · 1024 × 1536 · 原卡框、背景与铭牌已移除</p><div class="controls"><button data-bg="checker">棋盘格</button><button data-bg="#f5f3ec">浅色背景</button><button data-bg="#20242b">深色背景</button></div><div class="grid"><figure class="portrait"><div class="stage"><img src="life.png" alt="生命之神独立立绘"></div><figcaption>生命之神<a href="life.png" download>PNG</a></figcaption></figure><figure class="portrait"><div class="stage"><img src="weather.png" alt="天气之神独立立绘"></div><figcaption>天气之神<a href="weather.png" download>PNG</a></figcaption></figure><figure class="portrait"><div class="stage"><img src="death.png" alt="死亡之神独立立绘"></div><figcaption>死亡之神<a href="death.png" download>PNG</a></figcaption></figure></div><script>for(const b of document.querySelectorAll('button'))b.onclick=()=>{for(const s of document.querySelectorAll('.stage'))s.style.background=b.dataset.bg==='checker'?'':b.dataset.bg};</script></html>
