<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>双岛居民 · 原素材对照</title><style>body{margin:0;background:#555;color:#eee;font:14px system-ui}header{position:fixed;inset:0 0 auto;background:#252b2bdd;padding:12px;z-index:2;display:flex;align-items:center;gap:10px;flex-wrap:wrap}button,select{font:inherit;padding:8px;background:#dbcfb7;border:0}canvas{display:block}#status{position:fixed;bottom:12px;left:12px}a{color:#e3d5ba}</style><header>双岛居民 · 各十套原服装 <select id="motion"><option value="idle">待机</option><option value="walk">劳作替代：走路</option><option value="run">出征替代：跑步</option></select><button id="pause">暂停</button><button id="turn">查看背面</button><a href="/">返回游戏</a></header><div id="status">正在载入原角色…</div><script type="module">
import {updateCharacterPalettes} from './character-palette.js';import * as T from './vendor/three.module.js';import {loadCharacters} from './character-assets.js';import {CharacterView} from './character-view.js';import {appearance} from './character-animation.js';
const sources=await loadCharacters(),r=new T.WebGLRenderer({antialias:true});r.setPixelRatio(Math.min(devicePixelRatio,2));r.setClearColor('#595959');document.body.append(r.domElement);const scene=new T.Scene(),cam=new T.OrthographicCamera(-6,6,3.4,-3.4,.1,100);cam.position.set(0,3.5,12);cam.lookAt(0,1.1,0);scene.add(new T.HemisphereLight(0xffffff,0x6d6554,2));const sun=new T.DirectionalLight(0xffffff,3);sun.position.set(3,6,8);scene.add(sun);const actors=[];
for(let country=0;country<2;country++)for(let v=0;v<10;v++){let id=1;while(appearance(id,country).outfit!==v)id++;const e={id,country,adult:true,hp:100,x:0,y:0,sick:0};const a=new CharacterView(sources[country],e);scene.add(a.root);actors.push({a,e,v,country});}
let paused=false,back=false,time=0,last=0;document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停';};document.querySelector('#turn').onclick=e=>{back=!back;e.target.textContent=back?'查看正面':'查看背面';};function resize(){r.setSize(innerWidth,innerHeight);const aspect=innerWidth/innerHeight;cam.left=-6;cam.right=6;cam.top=6/aspect;cam.bottom=-6/aspect;cam.updateProjectionMatrix();}addEventListener('resize',resize);resize();
function frame(now){const dt=paused?0:Math.min(.1,last?(now-last)/1000:0);last=now;time+=dt;const mode=document.querySelector('#motion').value;for(const {a,e,v,country}of actors){e.soldier=mode==='run';e.x+=dt*(mode==='idle'?0:mode==='walk'?.6:1.8);a.update(e,time);a.root.position.set((v-4.5)*1.15,country?-1.35:1.1,0);a.root.rotation.y=back?Math.PI:0;a.root.scale.setScalar(1);}updateCharacterPalettes(scene);r.render(scene,cam);requestAnimationFrame(frame);}requestAnimationFrame(frame);document.querySelector('#status').textContent='上：农耕岛麦田暖色　下：畜牧岛雾蓝冷色。劳作与战斗使用现有走路／跑步占位，无专用挥镰、挥砍动作。';
</script></html>
