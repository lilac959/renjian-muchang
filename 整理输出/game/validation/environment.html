<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>双岛环境对照</title><style>body{margin:0;overflow:hidden;background:#234b53;color:#eee2bd;font:14px system-ui}canvas{display:block;width:100vw;height:100vh}nav{position:fixed;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap;max-width:95vw}button,a{border:1px solid #b6a37b;background:#293b3deb;color:#eee2bd;border-radius:6px;padding:8px 12px;text-decoration:none;cursor:pointer}output{position:fixed;bottom:12px;left:12px;background:#293b3de8;padding:8px 12px;border-radius:6px}</style><canvas id="world"></canvas><nav><a id="legacy">v09 对照</a><a id="modern">v16 新氛围</a><button id="overview">双岛总览</button><button id="horizon">海平线观景</button><button id="pasture">牧场近景</button><button id="motion">播放动画</button></nav><output id="status">正在加载场景…</output><script type="module">
import * as T from '../vendor/three.module.js';import {WorldView} from '../scene.js?v=16.3';import {World} from '../engine.js';import {QINGHE} from '../island-layout.js';
const args=new URLSearchParams(location.search),version=args.get('v')==='9'?9:16,canvas=document.querySelector('canvas'),view=new WorldView(canvas,{environmentVersion:version}),world=new World();world.entities=[];world.time=0;
let camera={x:52,y:25,zoom:1,yaw:0,pitch:.90},playing=false,last=performance.now(),mode=args.get('view')||'overview';
function resize(){view.resize(innerWidth,innerHeight)}addEventListener('resize',resize);resize();
const config=await fetch('../assets/islands/v16/environment.json').then(r=>r.json());
function setMode(next){mode=next;view.previewCamera=null;camera=next==='pasture'?{x:80,y:29,zoom:2.2,yaw:0,pitch:.8}:{x:52,y:25,zoom:1,yaw:0,pitch:.90};
 if(next==='horizon'){const c=config.cameras.find(c=>c.name==='Camera | 海平线薄雾预览'),m=new T.Matrix4().set(...c.matrix.flat()),b=new T.Matrix4().makeRotationX(-Math.PI/2);m.premultiply(b);const p=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,4000);p.position.setFromMatrixPosition(m).multiplyScalar(.5).add(new T.Vector3(...QINGHE.transform.position));p.quaternion.setFromRotationMatrix(m);p.userData.horizontalFov=2*Math.atan(c.sensor/(2*c.lens));view.previewCamera=p;}
 for(const [id,v] of [['legacy',9],['modern',16]])document.querySelector('#'+id).href=`?v=${v}&view=${mode}`;
}
for(const id of ['overview','horizon','pasture'])document.querySelector('#'+id).onclick=()=>setMode(id);
document.querySelector('#motion').onclick=e=>{playing=!playing;e.target.textContent=playing?'暂停动画':'播放动画';};
try{await view.load();view.colorPipeline.uniforms.debugDepth.value=args.has('debug');setMode(mode);document.querySelector('#status').textContent=`v${version} · 原布局 · ${view.scenery.plantCount} 株植被 · 12 只羊`;
 function frame(now){if(playing)world.time+=Math.min((now-last)/1000,.1);last=now;view.render(world,camera,null,null);requestAnimationFrame(frame)}requestAnimationFrame(frame);
}catch(e){document.querySelector('#status').textContent='加载失败：'+e.message;console.error(e);}
</script></html>
