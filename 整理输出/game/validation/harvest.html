<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>牧业产物 · 素材预览</title><style>body{overflow:hidden;margin:0;background:#303d3e;color:#ead9b6;font:16px Georgia,serif}canvas{display:block;width:100vw;height:calc(100vh - 160px)}header{text-align:center;padding:20px}button{background:#d5c2a0;color:#41382e;border:1px solid #a58d67;border-radius:5px;padding:10px 24px;margin:0 5px}p{font-size:14px}</style><header>牧业产物 · 肉片 / 羊毛 / 骨头<p>原素材拆分预览；点击下方按钮查看弹出、落地和淡出。</p><button id="play">播放掉落效果</button><button id="pause">暂停</button></header><script type="module">
import * as T from '../vendor/three.module.js';import {HarvestEffects} from '../harvest-effects.js';
const scene=new T.Scene(),camera=new T.PerspectiveCamera(35,innerWidth/((innerHeight-160)),.1,100),renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,(innerHeight-160));renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor('#303d3e');renderer.toneMapping=T.AgXToneMapping;document.body.append(renderer.domElement);camera.position.set(76,8,40);camera.lookAt(76,0,28);scene.add(new T.HemisphereLight('#fff1d9','#687473',2.4));const light=new T.DirectionalLight('#ffe9c6',2);light.position.set(70,12,32);scene.add(light);
const effects=new HarvestEffects(scene);await effects.load();const world={time:0,islands:[],result:false};let paused=false,last=performance.now();
for(const [i,name] of ['meat','wool','bone'].entries()){const model=effects.templates[name].clone(true);model.position.set(73+i*3,.05,28);model.scale.setScalar(2.3);scene.add(model);}
document.querySelector('#play').onclick=()=>{effects.clear();for(const [i,name] of ['meat','wool','bone'].entries())effects.spawn(name,73+i*3,31,world.time,i*.3);};document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'继续':'暂停';};
renderer.setAnimationLoop(()=>{const now=performance.now();if(!paused)world.time+=(now-last)/1000;last=now;effects.update(world);renderer.render(scene,camera);});
</script></html>
