<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="card-polish.css"><link rel="stylesheet" href="ui-materials.css"><link rel="stylesheet" href="prologue.css"><link rel="stylesheet" href="mobile.css"><style>body{background:#3a898e}#review{position:fixed;top:8px;left:8px;z-index:100;font-size:12px}#review button{padding:5px;font-size:11px}#review-output{background:#233;padding:3px;color:white}#paused{display:block}#hud{pointer-events:none}#skillNote{pointer-events:auto}</style></head><body><nav id="review"><button id="talk">对话</button><button id="long">长对话</button><button id="end">标题</button><button id="skill">技能说明</button><span id="review-output"></span></nav><div id="hud"><header class="altar-bar" style="height:118px"><button id="pauseToggle" aria-label="暂停游戏">Ⅱ</button></header><div id="paused">已暂停</div><aside id="skillNote" hidden><button class="x">×</button><div class="skill-note-heading"><h3>欢愉时刻</h3><small>冷却20秒</small></div><p>人类享乐18秒并停工，催生暂时无视口粮和住房，随后36秒食量翻倍；羊群和野兽繁殖加速，羊可叠加雨天。</p><button class="secondary">查看详情</button></aside><div id="aimHint" hidden>按住瞄准，松手释放</div><footer><div id="gods"></div><div id="skills"></div></footer></div><script type="module">
import{PrologueView}from'./prologue-view.js';import{buildCards}from'./ui.js';
const view=new PrologueView({changed(){},focus(){},continueGame(){},project:()=>({x:0,y:0})});
const text='怎么样，很简单吧，你一定一学就会。';
function show(mode){buildCards(0,()=>{},()=>{},()=>{});document.querySelector('#skillNote').hidden=mode!=='skill';document.querySelector('#aimHint').hidden=mode!=='skill';view.key='';const w={inPrologue:mode!=='skill',phase:mode==='end'?'ready':'intro',campaign:{line:0,finaleElapsed:10},dialogue:mode==='end'?null:{speaker:'death',left:'life',right:'death',text:mode==='long'?text.repeat(7):text},objective:()=>'',advanceDialogue(){}};view.update(w,100,{x:0,y:0,zoom:1});document.querySelector('#review-output').textContent=mode;}
for(const [id,mode]of[['talk','talk'],['long','long'],['end','end'],['skill','skill']])document.getElementById(id).onclick=()=>show(mode);show('talk');
</script></body></html>
