<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>天气与灵魂反馈验证</title><link rel="stylesheet" href="../style.css"><style>nav{position:fixed;top:12px;left:12px;z-index:4;display:flex;gap:6px}#bottle{position:fixed;top:12px;right:18%;z-index:3;background:#2d3738;border:4px solid #b9a780;border-radius:12px;padding:20px 48px;color:#e9e6cb}#status{position:fixed;bottom:15px;left:15px;z-index:4;background:#283a3b;padding:10px}</style><canvas id="world"></canvas><nav><button id="cold">下雪</button><button id="rain">降雨</button><button id="hot">酷热</button><button id="normal">放晴</button><button id="strike">闪电与收魂</button><button id="soulCheck">收魂遮挡检查</button><button id="pause">暂停</button></nav><div id="bottle">♧ 灵魂瓶</div><output id="status">加载中</output><script type="module">
import {WorldView} from '../scene.js';import {World} from '../engine.js';import {GameAudio} from '../game-audio.js';
const world=new World(),view=new WorldView(document.querySelector('canvas')),audio=new GameAudio();let paused=false,last=0;
function resize(){view.resize(innerWidth,innerHeight)}resize();addEventListener('resize',resize);
for(const kind of ['cold','rain','hot','normal'])document.getElementById(kind).onclick=()=>{audio.unlock();for(const i of world.islands)i.weather={kind,left:30};world.visualEvents.push({id:'weather',weather:kind,x:52,y:28,time:world.time});document.getElementById('status').textContent=kind+' · 地表、屋顶、植被与人物同步变化';};
document.getElementById('strike').onclick=()=>{audio.unlock();const p=world.humans()[0]||{x:25,y:28};world.visualEvents.push({id:'lightning',x:p.x,y:p.y,time:world.time,targets:[]});world.effects.push({x:p.x,y:p.y,soul:true,life:1.8});};
document.getElementById('soulCheck').onclick=()=>{const p=world.humans()[0];world.effects.push({x:p.x,y:p.y,soul:true,life:.18});paused=true;document.getElementById('pause').textContent='继续';};
document.getElementById('pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'继续':'暂停';};
await view.load();document.getElementById('status').textContent='点击天气查看整体变化；闪电与收魂可重复预览';world.visualEvents??=[];
function frame(now){const dt=last?Math.min(.1,(now-last)/1000):0;last=now;if(!paused){world.time+=dt;for(const e of world.effects)e.life-=dt;world.effects=world.effects.filter(e=>e.life>0);for(const i of world.islands)i.weather.left=Math.max(0,i.weather.left-dt);}const rect=document.getElementById('bottle').getBoundingClientRect();view.soulTarget={x:rect.x+rect.width/2,y:rect.y+rect.height/2};audio.update(world.visualEvents,{world,paused});view.render(world,{x:52,y:28,zoom:1.3,yaw:0,pitch:.9});requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
